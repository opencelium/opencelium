<VirtualHost *:80> 
	RewriteEngine On
	RewriteCond %{HTTPS} off
	RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI}
</VirtualHost>


<IfModule mod_ssl.c>
        <VirtualHost _default_:443>

                DocumentRoot /opt/opencelium/src/frontend

                <Directory /opt/opencelium/src/frontend>
                    AllowOverride All
                    Require all granted
                </Directory>

                ErrorLog ${APACHE_LOG_DIR}/error.log
                CustomLog ${APACHE_LOG_DIR}/access.log combined

                SSLEngine on

                SSLCertificateFile     /etc/ssl/certs/ssl-cert-snakeoil.pem
                SSLCertificateKeyFile /etc/ssl/private/ssl-cert-snakeoil.key
                
                # Activate SSL Proxy 
                SSLProxyEngine on

                # Routing of all requests to /api to the backend server. pls replace {localhost}
                ProxyPass /api/ https://{localhost}:9090/
                ProxyPassReverse /api/ https://{localhost}:9090/

                # Set proxy header
                RequestHeader set X-Forwarded-For %{REMOTE_ADDR}s
                RequestHeader set X-Forwarded-Proto https

                # Optional: CORS header for API requests, if required
                Header set Access-Control-Allow-Origin "*"
                Header set Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS"
                Header set Access-Control-Allow-Headers "Content-Type, Authorization"
                
        </VirtualHost>
</IfModule>
