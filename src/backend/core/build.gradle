plugins {
	id 'java'
	id 'org.springframework.boot'
}

tasks.named('bootJar') {
	archiveBaseName = 'oc-app'
}

// Integration tests (CONTRIBUTING §9.1): real infrastructure via Testcontainers, so they need
// Docker and stay out of `check`. They share the test source set's `testutil` package.
sourceSets {
	integrationTest {
		compileClasspath += sourceSets.main.output + sourceSets.test.output
		runtimeClasspath += sourceSets.main.output + sourceSets.test.output
	}
}

configurations {
	integrationTestImplementation.extendsFrom testImplementation
	integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

tasks.register('integrationTest', Test) {
	group = 'verification'
	description = 'Runs integration tests against real infrastructure. Requires Docker.'
	testClassesDirs = sourceSets.integrationTest.output.classesDirs
	classpath = sourceSets.integrationTest.runtimeClasspath
	useJUnitPlatform()
	shouldRunAfter tasks.named('test')
}

// Compile them in every build so they cannot rot — running them stays deliberate.
tasks.named('check') {
	dependsOn tasks.named('compileIntegrationTestJava')
}

dependencies {
	implementation project(':common')
	implementation project(':execution')

	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-ldap'
	implementation 'org.springframework.boot:spring-boot-starter-mongodb'
	implementation 'org.springframework.boot:spring-boot-starter-restclient'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.security:spring-security-ldap'

	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-mongodb-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-restclient-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-ldap-test'
	testImplementation 'com.unboundid:unboundid-ldapsdk'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	integrationTestImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	integrationTestImplementation 'org.testcontainers:testcontainers-mongodb'
}
