springdoc:
  swagger-ui:
    path: /docs
    supportedSubmitMethods:
      - get
      - put
      - post
      - delete
      - options
      - head
      - patch
      - trace
    tagsSorter: alpha
    open-api-custom-settings:
      extensions:
        x-links-enabled: false
  default-produces-media-type: application/json

logging:
  file: src/main/resources/logs
  pattern:
    console: "%d{dd-MM-yyyy HH:mm:ss.SSS} %magenta([%thread]) %highlight(%-5level) %logger.%M - %msg%n"
  level:
    org:
      springframework:
        security:
          # Activate or deactivate logs during LDAP authentication
          ldap: OFF # OFF or DEBUG;

management:
  health:
    defaults:
      enabled: false
  endpoint:
    health:
      show-details: always
      status:
        http-mapping:
          OUT_OF_SERVICE: 200
          DOWN: 200
          UP: 200

opencelium:
  version: 5.3
  ###########################################################################
  #                                                                         #
  #   Interface languages                                                   #
  #                                                                         #
  #   Controls which languages the user interface offers and which one is   #
  #   used for users who have none set. Codes are ISO 639-1 (two letters,   #
  #   lowercase): en, de, fr, ...                                           #
  #                                                                         #
  #   default   - language applied to new users, to LDAP users on first     #
  #               login, and as the fallback when a notification template   #
  #               has no content in the recipient's language                #
  #   supported - comma-separated list of languages a user may be set to,   #
  #               and the list returned by GET /message/languages for       #
  #               authoring notification templates; 'default' must be one   #
  #               of them. Listing a language does not create its           #
  #               translations - the matching frontend bundle must exist    #
  #               too, otherwise the interface falls back to English.       #
  #                                                                         #
  ###########################################################################
  language:
    default: en
    supported: en,de
  ###########################################################################
  #                                                                         #
  #   /application-config endpoint (admin-only application.yml editor)      #
  #                                                                         #
  #   Powers the GET/PATCH /application-config REST endpoint, which lets    #
  #   an admin view and edit this very configuration file from the UI       #
  #   without shell access to the server. Before every write the current    #
  #   file is backed up and the new content is written atomically, so a     #
  #   bad edit can always be rolled back from a backup.                     #
  #                                                                         #
  #   backup.directory — where pre-write backups go (.bak.<epochMillis>)    #
  #   backup.keep      — how many recent backups to retain per target file  #
  #                                                                         #
  #   The endpoint always reads and writes the application.yml the          #
  #   application was started with: src/main/resources/application.yml,     #
  #   resolved against the working directory. To keep application.yml       #
  #   elsewhere, set the env variable OPENCELIUM_CONFIG_FILEPATH to its     #
  #   location. It is used by the startup YAML migrator, as Spring's        #
  #   spring.config.location and by the config editor.                      #
  #                                                                         #
  #   DO NOT modify or remove this block.                                   #
  #                                                                         #
  ###########################################################################
  config:
    backup:
      directory: runtime/backup/application
      keep: 10
  ###########################################################################
  #                                                                         #
  #   Sweepers                                                              #
  #                                                                         #
  #   test-connection — permanently removes leftover test connections       #
  #     enabled       — turn the sweeper on/off (default: true)             #
  #     fixed-delay   — ms between runs, non-overlapping (default: 1h)      #
  #     initial-delay — ms before the first run; 0 also cleans at startup   #
  #                                                                         #
  ###########################################################################
  sweeper:
    test-connection:
      enabled: true
      fixed-delay: 900000
      initial-delay: 0
  ###########################################################################
  #                                                                         #
  #   Background connector health monitor                                   #
  #                                                                         #
  #   enabled           — master switch for the periodic sweep              #
  #   interval          — delay between two sweeps in milliseconds          #
  #   initial-delay     — delay before the first sweep after startup (ms)   #
  #   failure-threshold — consecutive failed checks before a connector's    #
  #                       status transitions to DOWN/AUTH_FAILED            #
  #                       (flap damping); recovery needs a single success   #
  #   parallelism       — how many connectors are checked concurrently      #
  #   request-logging   — INFO-log each check's request (method + endpoint  #
  #                       template, never resolved credentials) and its     #
  #                       response (status, latency, truncated body)        #
  #                                                                         #
  ###########################################################################
  connector-health:
    enabled: true
    interval: 60000
    initial-delay: 10000
    failure-threshold: 3
    parallelism: 4
    request-logging:
      enabled: false
      max-body-length: 500
  ###########################################################################
  #                                                                         #
  #   Is customizable                                                       #
  #                                                                         #
  ###########################################################################
  debug-mode: true
  forgot-psw:
    base-url: https://frontend.example.com/set-password # the frontend's set-password page; reset and admin links add ?token=...
    token-activity-time: 240000
    max-email-validation-attempts: 3
    lockout-time: 480000
    admin-link-activity-time: 86400000 # lifetime in ms of a set-password link an admin issues (24 hours)
  connector:
    security:
      key: keykeygjhgjh # used for encrypt and decrypt request data
    master-password: # put your master password
  token:
    secret: 84bbce3d33de467b47b7e76c2563769!3f9aff968def8ef2674856f67ae8a93f
    activity-time: 18000
    experation-time: 86400
  ###########################################################################
  #                                                                         #
  #   Global variables                                                      #
  #                                                                         #
  #   secret-key      - key that encrypts the values of secret global       #
  #                     variables in the database. Empty: a built-in        #
  #                     default key is used. That default is the same for   #
  #                     every installation and public in the source code,   #
  #                     so it hides the values but does not protect them    #
  #                     from anyone who has the database. For real          #
  #                     protection set your own key, a long random string,  #
  #                     and set it BEFORE the first secret is saved: a      #
  #                     secret saved under one key cannot be read under     #
  #                     another. There is no key rotation; after a key      #
  #                     change every secret has to be entered again. Keep   #
  #                     a copy of your key in a safe place, apart from the  #
  #                     database backups.                                   #
  #                     It can come from the environment variable           #
  #                     OPENCELIUM_GLOBALVARIABLE_SECRETKEY instead, which  #
  #                     takes precedence over this file.                    #
  #   max-value-bytes - largest value of one global variable, in bytes      #
  #                                                                         #
  #   max-script-bytes  - largest code of one script variable, in bytes     #
  #   script-timeout-ms - how long, in milliseconds, an enhancement may     #
  #                       run in a workflow, whether or not it imports a    #
  #                       script variable, and how long a test run of a     #
  #                       script may take                                   #
  #                                                                         #
  #   queue - a workflow that uses a mutable global variable runs one       #
  #           execution at a time; with busy policy Queue a further start   #
  #           waits for the running one                                     #
  #     max-waiting      - how many starts may wait per workflow; one more  #
  #                        is refused                                       #
  #     max-wait-minutes - how long a start may wait before it is dropped   #
  #                                                                         #
  #   change-log - the change history of every global variable              #
  #     max-run-entries - how many entries of run writes it keeps per       #
  #                       variable; a run adds one entry per variable it    #
  #                       wrote, and past the limit the oldest go first     #
  #                                                                         #
  ###########################################################################
  global-variable:
    secret-key: ""
    max-value-bytes: 65536
    max-script-bytes: 262144
    script-timeout-ms: 5000
    queue:
      max-waiting: 100
      max-wait-minutes: 60
    change-log:
      max-run-entries: 200
  ###########################################################################
  #                                                                         #
  #   Configuration for Notification                                        #
  #                                                                         #
  #   for handling several webhooks separate url "," and then webhook       #
  #   notification:                                                         #
  #    tools:                                                               #
  #      income-webhook:                                                    #
  #        url: webhook                                                     #
  #                                                                         #
  ###########################################################################
  notification:
    tools:
      incoming-webhook:
        url: # insert your webhook url here
  installation:
    type: sources
  service-portal:
    base-url: https://service.opencelium.io
    token: your-token-heren
  ###########################################################################
  #                                                                         #
  #   Remote invoker repository                                             #
  #                                                                         #
  #   Source the invoker files are downloaded from by                       #
  #   POST /invoker/remote (/api/invoker/remote behind the proxy).          #
  #                                                                         #
  #   url    - GitHub Contents API url of the folder that holds the         #
  #            invoker xml files                                            #
  #   branch - git ref (branch, tag or commit) the files are read from      #
  #                                                                         #
  ###########################################################################
  invoker-repository:
    url: https://api.github.com/repos/opencelium/invoker/contents
    branch: main
  ###########################################################################
  #                                                                         #
  #   Polyglot Engine Configuration                                         #
  #   You can enable Python 3, Ruby, or GraalVM JS                          #
  #   using this configuration.                                             #
  #                                                                         #
  #   By default OC uses Nashorn JS                                         #
  #                                                                         #
  ###########################################################################
#  polyglot:
#    # Enables or disables the polyglot service integration.
#    # Default: false
#    enabled: false
#
#    # Communication protocol used to connect to the polyglot service.
#    # Supported: grpc (default), http (future)
#    # Default: grpc
#    protocol: grpc
#
#    # Host address of the polyglot service.
#    # Default: 127.0.0.1
#    host: '127.0.0.1'
#
#    # Port number of the polyglot service.
#    # Default: 6566
#    port: 6566
#
#    # Automatically starts the polyglot service JAR if not running.
#    # If false, assumes the service is already running externally.
#    # Default: false
#    auto-start: false
#
#    launch:
#      # Path to the polyglot service JAR file.
#      # Required only if auto-start is true.
#      # Example: /opt/polyglot/polyglot-service.jar
#      jarPath:
#
#      # Command-line arguments passed to the polyglot service.
#      args:
#
#      # Maximum time (in seconds) to wait for the service to start and respond.
#      # Default: 30
#      waitTimeoutSec: 30
#
#      # JVM arguments used when launching the polyglot service.
#      # Adjust for performance or memory tuning.
#      # Default: "-Xms64m -Xmx256m"
#      jvmArgs: '-Xms64m -Xmx256m'
#
#      # Enables forwarding of logs produced by the external polyglot JAR
#      # to this application’s logging system.
#      # Default: false
#      external-log-enabled: false

#  support:
#    file:
#      directory: src/main/resources/support-files
#      limit:
#        success: 1
#        fail: 5
#  log:
#    retention:
#      per-connection:
#        success: 2
#        fail: 3
#      test-connection:
#        enabled: true
#        max-age: 240000
#        initial-delay: 60000
#        sweep-interval: 600000
#
#  rest-template:
#    proxy:
#      host: 127.0.0.1
#      port: 8082
#      username: ####
#      password: ####
  ###########################################################################
  #                                                                         #
  #   Online services                                                       #
  #                                                                         #
  #   'active' is the master switch for every feature that calls a remote   #
  #   OpenCelium service: Service Portal (subscriptions, invoker/template   #
  #   sync, usage reports), the remote invoker repository and the online    #
  #   update assistant. When the key is commented out or removed, online    #
  #   services are ENABLED (default: true). With 'active: false' the        #
  #   affected endpoints do not call the internet and instead return a      #
  #   message explaining how to re-enable them.                             #
  #                                                                         #
  #   'invoker-sync' / 'template-sync' schedule the automatic Service       #
  #   Portal sync jobs (both default to inactive).                          #
  #                                                                         #
  ###########################################################################
#  online-services:
#    invoker-sync:
#      time: 0 0 0 * * *
#      active: false
#    template-sync:
#      time: 0 0 0 * * *
#      active: false
#    active: true
