###########################################################################
#                                                                         #
#   Webserver configuration section                                       #
#                                                                         #
#   Find here the default port configuration of the backend server        #
#   and the ssl configuration.                                            #
#                                                                         #
###########################################################################
server:
  port: 9090
  address: 127.0.0.1
  forward-headers-strategy: native
websocket:
  endpoint: /ws
#  ssl:
#    enabled: true
#    key-store-type: PKCS12
#    key-store: src/main/resources/opencelium.p12
#    key-store-password: root
#    key-password: root
#    key-alias: tomcat

###########################################################################
#                                                                         #
#   Database configuration section of MariaDB and MongoDB                 #
#                                                                         #
###########################################################################
spring:
  datasource:
    url: jdbc:mariadb://localhost:3306/opencelium?useUnicode=true&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=Europe/Berlin
    username: opencelium
    password: secret1234
    initialization-mode: always
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      # MariaDB 11.6+ enables innodb_snapshot_isolation by default: a REPEATABLE READ transaction
      # that locks or deletes a row changed after its read view opened fails with error 1020
      # "Record has changed since last read". Quartz's JDBC job store and the concurrent
      # scheduler/connection cleanup rely on the READ COMMITTED semantics instead.
      transaction-isolation: TRANSACTION_READ_COMMITTED
  data:
    mongodb:
      uri: mongodb://oc_admin:secretsecret@localhost:27017/opencelium
  #     Example - mongodb://<username>:<password>@<host>:<port>/<database>
  ###########################################################################
  #                                                                         #
  #   Mail configuration section                                            #
  #                                                                         #
  ###########################################################################
  #  mail:
  #    opencelium:
  #      from: noreply@opencelium.io
  #  #    enabled: false
  #    host: smtp.gmail.com
  #    port: 587
  #    username:
  #    password:
  #    properties:
  #      mail:
  #        smtp:
  #          auth: true
  #          connectiontimeout: 5000
  #          timeout: 5000
  #          writetimeout: 5000
  #          starttls:
  #            enable: true
  #        ssl:
  #          trust: example.host.de
  ###########################################################################
  #                                                                         #
  #   Configuration of third part tools                                     #
  #                                                                         #
  ###########################################################################
  #  ldap:
  #    embedded:
  #      base-dn: dc=springframework,dc=org
  #      ldif: classpath:test-server.ldif
  #      port: 8389
  #      url: ldap://localhost:8389/
  #  rabbitmq:
  #    host: localhost
  #    port: 5672
  #    username: guest
  #    password: guest
  ###########################################################################
  #                                                                         #
  #   Basic configuration section. Do not change the following              #
  #   configuration.                                                        #
  #                                                                         #
  ###########################################################################
  main:
    banner-mode: "off"
  jpa:
    properties:
      hibernate:
        id:
          new_generator_mappings: false
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 1GB
      max-request-size: 1GB
  http:
    multipart:
      enabled: false
  quartz:
    properties:
      org:
        quartz:
          threadPool:
            threadCount: 5
          jobStore:
            tablePrefix: QRTZ_
    job-store-type: jdbc
  liquibase:
    change-log: classpath:/db/changelog/changelog-master.xml
  mvc:
    throw-exception-if-no-handler-found: true #enables exception handling for endpoints that is not defined in controllers
  web:
    resources:
      add-mappings: false
  ######################################################################
